<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESIDUAL · Audit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><a href="/" style="color:inherit;text-decoration:none">RESIDUAL</a> <span style="font-weight:300;letter-spacing:.06em;color:var(--muted)">AUDIT</span></h1>
    <p class="thesis">Every event, number, source hash and paper order behind the landing page. <a href="/">Back to the story</a></p>
  </div>
  <div id="kpis" class="kpis"></div>
</header>
<nav class="tabs" role="tablist">
  <button data-tab="board" class="on">Event board</button>
  <button data-tab="results">Results</button>
  <button data-tab="live">Live watcher</button>
  <button data-tab="method">Method</button>
  <button data-tab="operator">Operator</button>
</nav>
<main>
  <section id="tab-board" class="tab on">
    <div class="board-wrap">
      <div class="table-scroll"><table id="board" class="board"></table></div>
      <div id="detail" class="detail"><p class="muted">Select an event to see its decomposition, strategy card, evidence and paper execution.</p></div>
    </div>
  </section>
  <section id="tab-results" class="tab"></section>
  <section id="tab-live" class="tab"></section>
  <section id="tab-method" class="tab"></section>
  <section id="tab-operator" class="tab"></section>
</main>
<footer class="foot" id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
